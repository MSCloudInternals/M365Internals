on: [pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Prerequisites
        run: ./build/vsts-prerequisites.ps1
        shell: pwsh
      - name: Validate
        run: ./build/vsts-validate.ps1
        shell: pwsh
